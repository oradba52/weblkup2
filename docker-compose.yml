version: "3.9"

services:
  # ── FastAPI приложение ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym_rental_app
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DATABASE_URL: sqlite:////data/gym_rental.db
    volumes:
      # SQLite база данных — сохраняется между перезапусками контейнера
      - db_data:/data
      # Загруженные фотографии товаров
      - app_uploads:/app/app/uploads
    networks:
      - gym_net

  # ── Nginx reverse-proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gym_rental_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/gym_rental.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - gym_net

volumes:
  db_data:
  app_uploads:

networks:
  gym_net:
    driver: bridge
