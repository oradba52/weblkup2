<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymRental — {{ title }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5/css/all.min.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li>
    </ul>
    <ul class="navbar-nav ml-auto">
      <li class="nav-item dropdown">
        <a class="nav-link" data-toggle="dropdown" href="#"><i class="fas fa-user-circle"></i> {{ current_user.username }}</a>
        <div class="dropdown-menu dropdown-menu-right">
          <a href="/logout" class="dropdown-item"><i class="fas fa-sign-out-alt"></i> Выйти</a>
        </div>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-info elevation-4">
    <a href="/admin" class="brand-link"><i class="fas fa-tshirt mr-2 ml-2"></i><span class="brand-text font-weight-bold">GymRental</span></a>
    <div class="sidebar">
      <nav class="mt-3">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
          <li class="nav-item"><a href="/admin" class="nav-link"><i class="nav-icon fas fa-tachometer-alt"></i><p>Дашборд</p></a></li>
          <li class="nav-item"><a href="/admin/catalog" class="nav-link {% if active_page == 'catalog' %}active{% endif %}"><i class="nav-icon fas fa-tshirt"></i><p>Каталог</p></a></li>
          <li class="nav-item"><a href="/admin/persons" class="nav-link {% if active_page == 'persons' %}active{% endif %}"><i class="nav-icon fas fa-users"></i><p>Заказчики</p></a></li>
          <li class="nav-item"><a href="/admin/bookings" class="nav-link {% if active_page == 'bookings' %}active{% endif %}"><i class="nav-icon fas fa-calendar-check"></i><p>Бронирования</p></a></li>
          <li class="nav-item"><a href="/admin/sales" class="nav-link {% if active_page == 'sales' %}active{% endif %}"><i class="nav-icon fas fa-shopping-cart"></i><p>Продажи</p></a></li>
          <li class="nav-item"><a href="/admin/reports" class="nav-link {% if active_page == 'reports' %}active{% endif %}"><i class="nav-icon fas fa-chart-bar"></i><p>Отчёты</p></a></li>
          <li class="nav-item"><a href="/admin/users" class="nav-link {% if active_page == 'users' %}active{% endif %}"><i class="nav-icon fas fa-user-shield"></i><p>Админы</p></a></li>
          <li class="nav-item"><a href="/admin/login-log" class="nav-link {% if active_page == 'login_log' %}active{% endif %}"><i class="nav-icon fas fa-list-alt"></i><p>Логи входов</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <section class="content-header"><div class="container-fluid"><h1>{{ title }}</h1></div></section>
    <section class="content">
      <div class="container-fluid">
        <div class="alert alert-warning">
          <i class="fas fa-clock"></i> {{ message }}
        </div>
      </div>
    </section>
  </div>

  <footer class="main-footer"><strong>GymRental</strong> — система учёта проката купальников</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
