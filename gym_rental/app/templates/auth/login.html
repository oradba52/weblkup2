<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymRental — Вход</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5/css/all.min.css">
</head>
<body class="hold-transition login-page" style="background: linear-gradient(135deg, #2c3e50, #4ca1af);">
<div class="login-box">
  <div class="card card-outline card-info">
    <div class="card-header text-center">
      <h1 class="h4"><i class="fas fa-tshirt mr-2"></i>GymRental</h1>
      <p class="text-muted">Система учёта проката купальников</p>
    </div>
    <div class="card-body login-card-body">
      {% if error %}
      <div class="alert alert-danger alert-dismissible">
        <button type="button" class="close" data-dismiss="alert">&times;</button>
        <i class="fas fa-exclamation-circle"></i> {{ error }}
      </div>
      {% endif %}
      <form action="/login" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="input-group mb-3">
          <input type="text" name="username" class="form-control" placeholder="Логин" required autofocus>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-user"></span></div></div>
        </div>
        <div class="input-group mb-3">
          <input type="password" name="password" class="form-control" placeholder="Пароль" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-lock"></span></div></div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-info btn-block"><i class="fas fa-sign-in-alt mr-1"></i>Войти</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
