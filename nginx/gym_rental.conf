# Nginx reverse-proxy для GymRental (FastAPI)

upstream gym_rental_backend {
    server app:8000;
}

server {
    listen 80;
    server_name _;

    # Размер загружаемых файлов (фотографии товаров)
    client_max_body_size 10m;

    # Проксирование на FastAPI
    location / {
        proxy_pass http://gym_rental_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Кеширование загруженных картинок
    location /uploads/ {
        proxy_pass http://gym_rental_backend;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Кеширование статики
    location /static/ {
        proxy_pass http://gym_rental_backend;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Таймауты для генерации отчётов (Excel/PDF могут быть тяжёлыми)
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}
