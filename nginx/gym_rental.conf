# Nginx reverse-proxy для GymRental (FastAPI)

# Docker's embedded DNS — резолвим имя при запросе, а не при старте
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Размер загружаемых файлов (фотографии товаров)
    client_max_body_size 10m;

    # Проксирование на FastAPI (переменная forcing runtime DNS resolution)
    location / {
        set $backend_upstream http://app:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Кеширование загруженных картинок
    location /uploads/ {
        set $backend_upstream http://app:8000;
        proxy_pass $backend_upstream;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Кеширование статики
    location /static/ {
        set $backend_upstream http://app:8000;
        proxy_pass $backend_upstream;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Таймауты для генерации отчётов (Excel/PDF могут быть тяжёлыми)
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}
